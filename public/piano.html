<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金色大厅 · 音乐会钢琴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="concert.css" />
  <!-- 第三方库走 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.7/build/opensheetmusicdisplay.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="concert">
  <header class="hall-bar">
    <a class="back-link" href="index.html">← 乐器选择</a>
    <div class="hall-title">
      <span class="crest">❦</span>
      <span class="hall-name">金色大厅</span>
      <span class="hall-sub">Goldener Saal · Konzertflügel</span>
    </div>
    <div class="bar-actions">
      <button id="openShelfBtn" class="gold-btn">📜 乐谱柜</button>
      <label class="file-label ghost-btn" title="上传 .musicxml / .xml / .mxl">
        上传乐谱
        <input type="file" id="fileInput" accept=".xml,.musicxml,.mxl" />
      </label>
    </div>
  </header>

  <!-- 3D 音乐厅 -->
  <section class="stage" id="stage3d">
    <div class="stage-loading">
      <div class="loading-crest">❦</div>
      <div>正在布置金色大厅…</div>
    </div>

    <div class="now-playing" id="nowPlaying">
      <div class="np-kicker">Heute Abend · 今晚曲目</div>
      <div class="np-title" id="npTitle">尚未选曲</div>
      <div class="np-sub" id="npSub">打开「乐谱柜」,挑一份乐谱放上谱架</div>
    </div>

    <div class="camera-dock" id="cameraDock"></div>

    <div class="transport">
      <div class="transport-buttons">
        <button id="playBtn" class="round-btn play" disabled title="演奏">▶</button>
        <button id="pauseBtn" class="round-btn" disabled title="暂停">❚❚</button>
        <button id="stopBtn" class="round-btn" disabled title="停止">■</button>
      </div>
      <div class="transport-progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time" id="timeLabel">0:00 / 0:00</span>
      </div>
      <label class="tempo">
        速度 <span id="tempoVal">100</span>%
        <input type="range" id="tempoSlider" min="40" max="160" value="100" />
      </label>
    </div>
  </section>

  <!-- WebGL 不可用时的 2D 键盘 -->
  <section class="piano-wrap fallback-piano">
    <div id="piano"></div>
  </section>

  <section class="hall-toolbar">
    <div class="status" id="status">请加载一个乐谱开始。</div>
    <div class="toolbar-toggles">
      <label class="toggle"><input type="checkbox" id="labelToggle" checked /> 音名提示</label>
      <label class="toggle"><input type="checkbox" id="glowToggle" checked /> 按键发光</label>
      <label class="toggle"><input type="checkbox" id="reverbToggle" checked /> 大厅混响</label>
      <label class="toggle"><input type="checkbox" id="orbitToggle" /> 镜头漫游</label>
      <span class="pedal-indicator" id="pedalIndicator" title="按住空格 = 延音踏板">延音踏板</span>
    </div>
  </section>
  <p class="keyboard-hint">
    自由演奏:直接点击 3D 琴键(可按住拖动滑奏),或用电脑键盘 —— <kbd>Z</kbd>~<kbd>/</kbd> 低音区、<kbd>Q</kbd>~<kbd>]</kbd> 高音区、
    <kbd>←</kbd><kbd>→</kbd> 移八度、按住 <kbd>空格</kbd> 踩延音踏板。拖动画面可环绕观看,滚轮缩放。
  </p>

  <!-- 纸质乐谱(OSMD 渲染,跟随演奏) -->
  <section class="sheet-desk">
    <div class="sheet-desk-head">
      <span class="sheet-desk-title">谱面 · Partitur</span>
      <label class="tempo score-zoom">
        谱面 <span id="scoreZoomVal">90</span>%
        <input type="range" id="scoreZoomSlider" min="45" max="120" value="90" />
      </label>
      <button id="fullScoreBtn" class="ghost-btn" hidden>渲染完整乐谱</button>
    </div>
    <div class="score-wrap paper-sheet">
      <div id="osmdContainer"></div>
    </div>
  </section>

  <!-- 乐谱柜(纸质乐谱卡片) -->
  <div class="shelf-backdrop" id="shelfBackdrop"></div>
  <aside class="shelf" id="shelf" aria-hidden="true">
    <div class="shelf-head">
      <div>
        <div class="shelf-title">乐谱柜 · Notenschrank</div>
        <div class="shelf-count" id="libraryCount"></div>
      </div>
      <button class="shelf-close" id="closeShelfBtn" title="关闭">✕</button>
    </div>
    <div class="shelf-filters">
      <div class="series-tabs" id="seriesTabs"></div>
      <input type="search" id="scoreSearch" class="shelf-search" placeholder="搜索曲名、作曲家、调性…" autocomplete="off" />
    </div>
    <div class="shelf-grid" id="shelfGrid"></div>
    <button class="ghost-btn shelf-more" id="shelfMore" hidden>翻出更多乐谱…</button>
  </aside>

  <script src="musicxml-parser.js"></script>
  <script src="piano.js"></script>
  <script type="module" src="hall/main.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
